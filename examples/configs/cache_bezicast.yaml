cache_config:
  max_warmup_steps: 4
  warmup_interval: 1
  max_cached_steps: -1
  max_continuous_cached_steps: 2
  Fn_compute_blocks: 1
  Bn_compute_blocks: 0
  residual_diff_threshold: 0.12
  enable_bezicast: true
  # Paper defaults: up to six real anchors, four control points, ridge=0.5.
  bezicast_history: 6
  bezicast_control_points: 4
  bezicast_ridge: 0.5
  # Pure-predictor default. Enable explicitly and validate thresholds per model.
  bezicast_guardrail: false
  # cache-dit conservative normalized query cap; not a paper-reported universal default.
  bezicast_u_max: 1.5
  bezicast_beta_max: 1.0
  # null: when guardrail=true, measure risk at u=1 for the current anchor design.
  bezicast_rho: null
  bezicast_gamma: 1.0
