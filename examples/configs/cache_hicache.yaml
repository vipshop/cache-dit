cache_config:
  max_warmup_steps: 8
  warmup_interval: 2
  max_cached_steps: -1
  max_continuous_cached_steps: 2
  Fn_compute_blocks: 1
  Bn_compute_blocks: 0
  residual_diff_threshold: 0.12
  enable_hicache: true
  # Highest finite-difference/Hermite order kept (the paper's N_order, <= 4).
  hicache_order: 2
  # Damping factor of the Hermite basis in (0, 1]; the paper uses 0.4-0.5 and it is
  # coupled to the cache aggressiveness, so re-sweep it per model.
  hicache_sigma: 0.5
